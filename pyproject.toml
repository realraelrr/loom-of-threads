[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-of-threads"
version = "0.3.0"
description = "Loom of Threads: weave fragmented threads into auditable knowledge"
requires-python = ">=3.11"
dependencies = []
license = { file = "LICENSE" }
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knowledge_archive.adapters.x" = ["*.js"]

[project.scripts]
loom = "knowledge_archive.cli:main"
knowledge-archive = "knowledge_archive.cli:main"
